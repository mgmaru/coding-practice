name: go-ci

# go/ 配下を変更した PR と、全ブランチへの push で走る。
# （feature ブランチへの push でも CI を回せるよう branches 限定を外している。
#   main へのマージ push もこの push トリガで検査される。）
on:
  push:
    paths:
      - "go/**"
      - "!go/**/*.md" # ドキュメント(*.md)だけの変更ではCIを起動しない
      - "!go/**/*.txt" # txt系も同様（README/サンプル等のドキュメント扱い）
      - "!go/**/*.log" # ログ/サンプルデータも除外
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - "!go/**/*.md"
      - "!go/**/*.txt"
      - "!go/**/*.log"
      - ".github/workflows/go-ci.yml"

permissions:
  contents: read

# 同一ブランチで連続 push したとき、古い実行を打ち切って最新だけ走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod # 使う Go の版は go.mod から読む

      # 層0: フォーマット。gofmt が整形漏れを列挙したら失敗させる（gofmt/vet は Go 組込みで追加導入不要）。
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"; echo "$unformatted"; exit 1
          fi

      # 層0: lint（go vet）。.go がまだ無いと "no packages to vet" で失敗するのでガードする。
      - name: go vet
        run: |
          if [ -n "$(git ls-files '*.go')" ]; then
            go vet ./...
          else
            echo ".go ファイルがまだ無いため go vet をスキップ（Go コード追加後に走ります）"
          fi
