name: python-ci

# 層0（フォーマット / lint / 型）を PR と、全ブランチへの push で実行する（言語ごとに 1 ファイル）。
# （feature ブランチへの push でも CI を回せるよう branches 限定を外している。
#   main へのマージ push もこの push トリガで検査される。）
on:
  push:
    paths:
      - "python/**"
      - "!python/**/*.md" # ドキュメント(*.md)だけの変更ではCIを起動しない
      - "!python/**/*.txt" # txt系も同様（README/サンプル等のドキュメント扱い）
      - "!python/**/*.log" # ログ/サンプルデータも除外
      - ".github/workflows/python-ci.yml" # このワークフロー自身の変更でも走らせる
  pull_request:
    paths:
      - "python/**"
      - "!python/**/*.md"
      - "!python/**/*.txt"
      - "!python/**/*.log"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

# 同一ブランチで連続 push したとき、古い実行を打ち切って最新だけ走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python # pyproject.toml がある場所
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # setup-uv は移動タグ（@v8 等）を出さないため、SHA で固定する
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      # Python の版は python/.python-version（3.12）が単一正本。uv が読み取り、無ければ自動DLする。
      # ruff / mypy は dev 依存として uv.lock で固定済み。--locked で lock とのズレも検出する。
      - name: Install (locked)
        run: uv sync --locked

      # ローカルでも同じ `uv run ruff ... / uv run mypy .` を実行すれば結果が一致する。
      - name: Ruff format check
        run: uv run ruff format --check . # CI では書き換えず、整形ズレがあれば失敗

      - name: Ruff lint
        run: uv run ruff check .

      - name: mypy (type check)
        run: uv run mypy .
