name: python-ci

# 層0（フォーマット / lint / 型）を PR と main への push で実行する（言語ごとに 1 ファイル）。
on:
  push:
    branches: [main] # マージ後の main を守る
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml" # このワークフロー自身の変更でも走らせる
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python # pyproject.toml がある場所
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        # setup-uv は移動タグ（@v8 等）を出さないため、SHA で固定する
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      # Python の版は python/.python-version（3.12）が単一正本。uv が読み取り、無ければ自動DLする。
      # ruff / mypy は dev 依存として uv.lock で固定済み。--locked で lock とのズレも検出する。
      - name: Install (locked)
        run: uv sync --locked

      # ローカルでも同じ `uv run ruff ... / uv run mypy .` を実行すれば結果が一致する。
      - name: Ruff format check
        run: uv run ruff format --check . # CI では書き換えず、整形ズレがあれば失敗

      - name: Ruff lint
        run: uv run ruff check .

      - name: mypy (type check)
        run: uv run mypy .
