name: rust-ci

# rust/ 配下を変更した PR と、全ブランチへの push で走る。
# （feature ブランチへの push でも CI を回せるよう branches 限定を外している。
#   main へのマージ push もこの push トリガで検査される。）
on:
  push:
    paths:
      - "rust/**"
      - "!rust/**/*.md" # ドキュメント(*.md)だけの変更ではCIを起動しない
      - "!rust/**/*.txt" # txt系も同様（README/サンプル等のドキュメント扱い）
      - "!rust/**/*.log" # ログ/サンプルデータも除外
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "!rust/**/*.md"
      - "!rust/**/*.txt"
      - "!rust/**/*.log"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

# 同一ブランチで連続 push したとき、古い実行を打ち切って最新だけ走らせる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust # Cargo workspace のルート
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable + rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust # Cargo.toml が rust/ 配下にあるため

      # 層0: フォーマット / lint。-D warnings で警告も失敗扱いにする。
      - name: rustfmt check
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
