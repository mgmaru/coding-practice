name: rust-ci

# rust/ 配下を変更した PR と main への push で走る。
on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "!rust/**/*.md" # ドキュメント(*.md)だけの変更ではCIを起動しない
      - "!rust/**/*.txt" # txt系も同様（README/サンプル等のドキュメント扱い）
      - "!rust/**/*.log" # ログ/サンプルデータも除外
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - "!rust/**/*.md"
      - "!rust/**/*.txt"
      - "!rust/**/*.log"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust # Cargo workspace のルート
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable + rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust # Cargo.toml が rust/ 配下にあるため

      # 層0: フォーマット / lint。-D warnings で警告も失敗扱いにする。
      - name: rustfmt check
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
